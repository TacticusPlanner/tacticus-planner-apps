# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # No automatic reviews: agents already review locally with the CodeRabbit CLI, so an automatic
    # PR review mostly repeats it and spends the shared hourly rate limit. Request one with a
    # `@coderabbitai review` comment when the PR needs it (see the workspace AGENTS.md).
    enabled: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!apps/web/public/game_catalog/datamines/**"
    - "!apps/web/datamine/**"
    - "!apps/web/openapi/**"
    - "!apps/web/public/locales/*/npcAbilityText/**"
    - "!apps/web/public/locales/*/raidBossAbilityText/**"
  path_instructions:
    - path: "apps/web/src/fsd/**"
      instructions: >-
        Check Feature-Sliced Design layer boundaries and slice public APIs as described in AGENTS.md.
        V2 is in production: flag breaking changes to routes, persisted storage formats and API
        contracts that lack a backward-compatible path for existing users and data.
    - path: "**/*.test.{ts,tsx}"
      instructions: >-
        Flag weakened or removed assertions, skipped tests, and tests that only cover the happy path.
    - path: ".github/workflows/**"
      instructions: >-
        Flag lowered coverage thresholds, removed or skipped checks, and new permissions or secrets
        reaching jobs that run pull request code.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
