name: Build Web

on:
  workflow_call:
    inputs:
      skip:
        description: Skip the build (reports the check as skipped, which satisfies required checks).
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: Upload the built web app artifact for deployment.
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out. Defaults to the triggering ref.
        required: false
        type: string
        default: ""
      run-validation:
        description: Run formatting, linting, FSD linting, typechecking, and knip.
        required: false
        type: boolean
        default: true
      vite-mode:
        description: Vite build mode — selects apps/web's build:<mode> script, which loads the matching .env.<mode> file (see shared/config/environment.ts).
        required: false
        type: string
        default: production
      vite-api-base-url:
        description: Tacticus Planner API base URL embedded by Vite.
        required: false
        type: string
        default: ""
      vite-api-scope:
        description: Microsoft Entra delegated API scope embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-authority:
        description: Microsoft Entra External ID authority embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-client-id:
        description: Microsoft Entra SPA client ID embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-tenant-id:
        description: Microsoft Entra External ID tenant ID embedded by Vite.
        required: false
        type: string
        default: ""
      upload-source-maps:
        description: Upload hidden source maps to PostHog error tracking and strip them from dist. Skipped with a warning until the POSTHOG_PERSONAL_API_KEY secret and the POSTHOG_PROJECT_ID repository variable are set.
        required: false
        type: boolean
        default: false
    secrets:
      POSTHOG_PERSONAL_API_KEY:
        description: PostHog personal API key with error-tracking write access, used to upload source maps.
        required: false

jobs:
  build:
    name: Build Web
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version
        run: echo "VITE_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply deployment variable overrides
        if: ${{ inputs.upload-artifact }}
        shell: bash
        run: |
          set_if_present() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          set_if_present VITE_API_BASE_URL "${{ inputs.vite-api-base-url }}"
          set_if_present VITE_API_SCOPE "${{ inputs.vite-api-scope }}"
          set_if_present VITE_MSAL_AUTHORITY "${{ inputs.vite-msal-authority }}"
          set_if_present VITE_MSAL_CLIENT_ID "${{ inputs.vite-msal-client-id }}"
          set_if_present VITE_MSAL_TENANT_ID "${{ inputs.vite-msal-tenant-id }}"

      # Source maps go to PostHog error tracking only (spec: client-error-reporting); the Vite plugin
      # uploads them during the build and deletes them from dist, so they are never deployed. Its
      # posthog-cli binary is downloaded on first use (pnpm-workspace.yaml skips the postinstall
      # download, so local installs never need releases.posthog.com).
      - name: Set up PostHog source map upload
        if: ${{ inputs.upload-source-maps }}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        shell: bash
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            # Not configured yet: build without source maps rather than block the deploy.
            echo "::warning::Skipping source map upload: set the POSTHOG_PERSONAL_API_KEY secret and the POSTHOG_PROJECT_ID variable."
            exit 0
          fi
          echo "POSTHOG_PERSONAL_API_KEY=$POSTHOG_PERSONAL_API_KEY" >> "$GITHUB_ENV"
          echo "POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID" >> "$GITHUB_ENV"

      # API types come from the committed copy of the API's OpenAPI document (spec: api-contract-sync).
      - name: Check API types are current
        if: ${{ inputs.run-validation }}
        run: |
          pnpm --filter web api:types
          git diff --exit-code -- apps/web/src/fsd/shared/api/schema.d.ts

      - name: Check the API spec is pinned to a commit
        if: ${{ inputs.run-validation }}
        run: |
          if [ "$(cat apps/web/openapi/api.ref)" = "local" ]; then
            echo "::error::apps/web/openapi/api.ref is 'local'. Run 'pnpm --filter web api:pull <api-commit-sha>' before merging."
            exit 1
          fi

      # Generated game text and images come from one data-mines commit (spec: datamine-source).
      - name: Check the datamine is pinned to a commit
        if: ${{ inputs.run-validation }}
        run: |
          if [ "$(cat apps/web/datamine/REF)" = "local" ]; then
            echo "::error::apps/web/datamine/REF is 'local'. Run 'pnpm --filter web datamine:pull <data-mines-tag>' before merging."
            exit 1
          fi

      # public/game_catalog/datamines holds exactly the sprites datamine/sprites.txt lists, and
      # nothing but datamines/ and curated/ sits directly under public/game_catalog.
      - name: Check the catalog image folders
        if: ${{ inputs.run-validation }}
        working-directory: apps/web
        run: |
          if ! diff <(grep -v '^#' datamine/sprites.txt | sed '/^$/d') \
            <(cd public/game_catalog/datamines && find . -type f | sed 's|^\./||' | LC_ALL=C sort); then
            echo "::error::public/game_catalog/datamines differs from datamine/sprites.txt. Run 'pnpm --filter web datamine:sprites'."
            exit 1
          fi
          extra=$(cd public/game_catalog && find . -mindepth 1 -maxdepth 1 ! -name datamines ! -name curated)
          if [ -n "$extra" ]; then
            echo "::error::public/game_catalog holds only datamines/ and curated/; move these: $extra"
            exit 1
          fi

      - name: Check formatting
        if: ${{ inputs.run-validation }}
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint
        if: ${{ inputs.run-validation }}
        run: pnpm lint

      - name: Lint FSD
        if: ${{ inputs.run-validation }}
        run: pnpm lint:fsd

      - name: Typecheck
        if: ${{ inputs.run-validation }}
        run: pnpm typecheck

      - name: Build
        run: pnpm build:${{ inputs.vite-mode }}

      # Startup-JS budget (openspec change trim-startup-bundle): fails the build on a regression.
      - name: Bundle budget
        run: pnpm --filter web bundle:budget

      # The PostHog plugin injects a chunk id into every chunk it uploads maps for. None means the
      # plugin never ran (e.g. turbo.json not passing the POSTHOG_* variables through to the build).
      - name: Check source maps were uploaded and not deployed
        if: ${{ inputs.upload-source-maps }}
        run: |
          if find apps/web/dist -name '*.map' | grep -q .; then
            echo "::error::Source maps were left in apps/web/dist after upload."
            exit 1
          fi
          if [ -n "${POSTHOG_PERSONAL_API_KEY:-}" ] && ! grep -lq '_posthogChunkIds' apps/web/dist/assets/*.js; then
            echo "::error::The PostHog source map plugin did not run: no chunk ids in apps/web/dist."
            exit 1
          fi

      - name: Upload web artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
