name: Build Web

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload the built web app artifact for deployment.
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out. Defaults to the triggering ref.
        required: false
        type: string
        default: ""
      run-validation:
        description: Run formatting, linting, FSD linting, and typechecking.
        required: false
        type: boolean
        default: true
      vite-api-base-url:
        description: Planner API base URL embedded by Vite.
        required: false
        type: string
        default: ""
      vite-api-scope:
        description: Planner API access scope embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-authority:
        description: Microsoft Entra External ID authority embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-client-id:
        description: Microsoft Entra SPA client ID embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-tenant-id:
        description: Microsoft Entra External ID tenant ID embedded by Vite.
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: ${{ inputs.vite-api-base-url }}
      VITE_API_SCOPE: ${{ inputs.vite-api-scope }}
      VITE_MSAL_AUTHORITY: ${{ inputs.vite-msal-authority }}
      VITE_MSAL_CLIENT_ID: ${{ inputs.vite-msal-client-id }}
      VITE_MSAL_TENANT_ID: ${{ inputs.vite-msal-tenant-id }}
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version
        run: echo "VITE_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        if: ${{ inputs.upload-artifact }}
        shell: bash
        run: |
          : "${VITE_API_BASE_URL:?Missing API base URL build variable}"
          : "${VITE_API_SCOPE:?Missing API scope build variable}"
          : "${VITE_MSAL_AUTHORITY:?Missing MSAL authority build variable}"
          : "${VITE_MSAL_CLIENT_ID:?Missing MSAL client ID build variable}"
          : "${VITE_MSAL_TENANT_ID:?Missing MSAL tenant ID build variable}"

      - name: Check formatting
        if: ${{ inputs.run-validation }}
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint
        if: ${{ inputs.run-validation }}
        run: pnpm lint

      - name: Lint FSD
        if: ${{ inputs.run-validation }}
        run: pnpm lint:fsd

      - name: Typecheck
        if: ${{ inputs.run-validation }}
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
