name: Build Web

on:
  workflow_call:
    inputs:
      skip:
        description: Skip the build (reports the check as skipped, which satisfies required checks).
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: Upload the built web app artifact for deployment.
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out. Defaults to the triggering ref.
        required: false
        type: string
        default: ""
      run-validation:
        description: Run the Lint and Checks jobs (eslint, prettier, FSD, pinned refs) and knip plus typecheck in the build job.
        required: false
        type: boolean
        default: true
      vite-mode:
        description: Vite build mode — selects apps/web's build:<mode> script, which loads the matching .env.<mode> file (see shared/config/environment.ts).
        required: false
        type: string
        default: production
      vite-api-base-url:
        description: Tacticus Planner API base URL embedded by Vite.
        required: false
        type: string
        default: ""
      vite-api-scope:
        description: Microsoft Entra delegated API scope embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-authority:
        description: Microsoft Entra External ID authority embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-client-id:
        description: Microsoft Entra SPA client ID embedded by Vite.
        required: false
        type: string
        default: ""
      vite-msal-tenant-id:
        description: Microsoft Entra External ID tenant ID embedded by Vite.
        required: false
        type: string
        default: ""
      upload-source-maps:
        description: Upload hidden source maps to PostHog error tracking and strip them from dist. Skipped with a warning until the POSTHOG_PERSONAL_API_KEY secret and the POSTHOG_PROJECT_ID repository variable are set.
        required: false
        type: boolean
        default: false
    secrets:
      POSTHOG_PERSONAL_API_KEY:
        description: PostHog personal API key with error-tracking write access, used to upload source maps.
        required: false

jobs:
  # Three jobs run side by side so a PR waits for the slowest one (eslint), not for every step in
  # a row. "Build Web" at the end only collects their results: it keeps the one required check name
  # the ruleset already lists, so adding or moving a step never needs a ruleset change.
  lint:
    name: Lint
    if: ${{ !inputs.skip && inputs.run-validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-web
        with:
          turbo-cache-key: lint

      # eslint --cache (see each package's lint:eslint script) re-lints only files whose content
      # changed. Type-aware rules can leave a cached result stale when a file's imports change, so
      # Full lint (lint-main.yml) runs uncached on every push to main and seeds this cache.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/*/node_modules/.cache/eslint
            packages/*/node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'apps/*/eslint.config.js', 'packages/*/eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'apps/*/eslint.config.js', 'packages/*/eslint.config.js') }}-

      - name: ESLint
        run: pnpm turbo run lint:eslint

  checks:
    name: Checks
    if: ${{ !inputs.skip && inputs.run-validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-web
        with:
          turbo-cache-key: checks

      # API types come from the committed copy of the API's OpenAPI document (spec: api-contract-sync).
      - name: Check API types are current
        run: |
          pnpm --filter web api:types
          git diff --exit-code -- apps/web/src/fsd/shared/api/schema.d.ts

      - name: Check the API spec is pinned to a commit
        run: |
          if [ "$(cat apps/web/openapi/api.ref)" = "local" ]; then
            echo "::error::apps/web/openapi/api.ref is 'local'. Run 'pnpm --filter web api:pull <api-commit-sha>' before merging."
            exit 1
          fi

      # Generated game text and images come from one data-mines commit (spec: datamine-source).
      - name: Check the datamine is pinned to a commit
        run: |
          if [ "$(cat apps/web/datamine/REF)" = "local" ]; then
            echo "::error::apps/web/datamine/REF is 'local'. Run 'pnpm --filter web datamine:pull <data-mines-tag>' before merging."
            exit 1
          fi

      # public/game_catalog/datamines holds exactly the sprites datamine/sprites.txt lists, and
      # nothing but datamines/ and curated/ sits directly under public/game_catalog.
      - name: Check the catalog image folders
        working-directory: apps/web
        run: |
          if ! diff <(grep -v '^#' datamine/sprites.txt | sed '/^$/d') \
            <(cd public/game_catalog/datamines && find . -type f | sed 's|^\./||' | LC_ALL=C sort); then
            echo "::error::public/game_catalog/datamines differs from datamine/sprites.txt. Run 'pnpm --filter web datamine:sprites'."
            exit 1
          fi
          extra=$(cd public/game_catalog && find . -mindepth 1 -maxdepth 1 ! -name datamines ! -name curated)
          if [ -n "$extra" ]; then
            echo "::error::public/game_catalog holds only datamines/ and curated/; move these: $extra"
            exit 1
          fi

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint FSD
        run: pnpm lint:fsd

  bundle:
    name: Typecheck and bundle
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-web
        with:
          turbo-cache-key: build

      # A release build (CD Prod checks out refs/tags/vX.Y.Z or, for a hotfix, vX.Y.Z.N) is versioned
      # by its tag, so analytics app_version names the release; any other build by its commit.
      - name: Set app version
        shell: bash
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo "VITE_APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Apply deployment variable overrides
        if: ${{ inputs.upload-artifact }}
        shell: bash
        run: |
          set_if_present() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          set_if_present VITE_API_BASE_URL "${{ inputs.vite-api-base-url }}"
          set_if_present VITE_API_SCOPE "${{ inputs.vite-api-scope }}"
          set_if_present VITE_MSAL_AUTHORITY "${{ inputs.vite-msal-authority }}"
          set_if_present VITE_MSAL_CLIENT_ID "${{ inputs.vite-msal-client-id }}"
          set_if_present VITE_MSAL_TENANT_ID "${{ inputs.vite-msal-tenant-id }}"

      # Source maps go to PostHog error tracking only (spec: client-error-reporting); the Vite plugin
      # uploads them during the build and deletes them from dist, so they are never deployed. Its
      # posthog-cli binary is downloaded on first use (pnpm-workspace.yaml skips the postinstall
      # download, so local installs never need releases.posthog.com).
      - name: Set up PostHog source map upload
        if: ${{ inputs.upload-source-maps }}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        shell: bash
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            # Not configured yet: build without source maps rather than block the deploy.
            echo "::warning::Skipping source map upload: set the POSTHOG_PERSONAL_API_KEY secret and the POSTHOG_PROJECT_ID variable."
            exit 0
          fi
          echo "POSTHOG_PERSONAL_API_KEY=$POSTHOG_PERSONAL_API_KEY" >> "$GITHUB_ENV"
          echo "POSTHOG_PROJECT_ID=$POSTHOG_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Knip
        if: ${{ inputs.run-validation }}
        run: pnpm turbo run lint:knip

      - name: Typecheck
        if: ${{ inputs.run-validation }}
        run: pnpm typecheck

      - name: Build
        run: pnpm build:${{ inputs.vite-mode }}

      # Startup-JS budget (openspec change trim-startup-bundle): fails the build on a regression.
      - name: Bundle budget
        run: pnpm --filter web bundle:budget

      # The PostHog plugin ends every chunk it uploads maps for with a `//# chunkId=` line. None means the
      # plugin never ran (e.g. turbo.json not passing the POSTHOG_* variables through to the build).
      - name: Check source maps were uploaded and not deployed
        if: ${{ inputs.upload-source-maps }}
        run: |
          if find apps/web/dist -name '*.map' | grep -q .; then
            echo "::error::Source maps were left in apps/web/dist after upload."
            exit 1
          fi
          if [ -n "${POSTHOG_PERSONAL_API_KEY:-}" ] && ! grep -lq '^//# chunkId=' apps/web/dist/assets/*.js; then
            echo "::error::The PostHog source map plugin did not run: no chunk ids in apps/web/dist."
            exit 1
          fi

      - name: Upload web artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Web
    needs: [lint, checks, bundle]
    # always() so a failed job above still reports here as a failure instead of skipping this check
    # (a skipped required check counts as passing). With skip set, nothing ran and this skips too.
    if: ${{ always() && !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Lint and Checks are skipped when run-validation is off; anything else must succeed.
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::A Build Web job failed; see the jobs above."
            exit 1
          fi
          if [ "$(echo "$RESULTS" | jq -r '.bundle.result')" != "success" ]; then
            echo "::error::Typecheck and bundle did not run."
            exit 1
          fi
