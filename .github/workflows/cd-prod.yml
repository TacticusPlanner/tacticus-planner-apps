name: CD Prod

# Release (release.yml) calls this with the tag it just created. Run it by hand only to redeploy
# an existing release tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy, such as v1.4.0.
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # The build only reads apps/web/.env.production, and the app throws at runtime on an empty
  # required value, so stop before deploying a build that cannot sign in.
  check-config:
    name: Check production config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Production only ships released versions, never an arbitrary branch or commit.
      - name: Check the ref is a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || ! gh release view "$REF" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "::error::$REF is not a published release tag (vX.Y.Z)."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.ref }}
          persist-credentials: false

      - name: Check required values
        shell: bash
        run: |
          missing=0
          for name in VITE_API_BASE_URL VITE_API_SCOPE VITE_MSAL_AUTHORITY VITE_MSAL_CLIENT_ID VITE_MSAL_TENANT_ID; do
            # Strip whitespace and the quotes dotenv allows around a value, so NAME="" counts as empty.
            value="$(grep -E "^${name}=" apps/web/.env.production | cut -d= -f2- | tr -d '[:space:]"'"'"'')"
            if [ -z "$value" ]; then
              echo "::error::${name} is empty in apps/web/.env.production."
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build
    needs: check-config
    uses: ./.github/workflows/_build-web.yml
    with:
      run-validation: false
      upload-artifact: true
      ref: ${{ inputs.ref }}
      vite-mode: production

  deploy:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to Azure Static Web Apps production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          skip_app_build: true
