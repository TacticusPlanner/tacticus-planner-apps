name: CD Stage

on:
  push:
    branches:
      - main

    paths-ignore:
      - "**/*.md"
      - "openspec/**"
      - ".claude/**"
      - ".agents/**"
      - ".design-sync/**"
      - LICENSE
  # Redeploys main by hand when a push did not trigger this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-stage
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build-web.yml
    with:
      run-validation: false
      upload-artifact: true
      vite-mode: staging

  deploy:
    name: Deploy Stage
    needs: build
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to Azure Static Web Apps stage
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGE }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          skip_app_build: true
