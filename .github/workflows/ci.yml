name: CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  # actions/labeler labels the PR from .github/labeler.yml, and the labels decide what runs.
  # Without a PR (manual runs, merge queue) or when labeling fails (a fork PR has a read-only
  # token), everything runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      code: ${{ steps.flags.outputs.code }}
      release-scripts: ${{ steps.flags.outputs.release-scripts }}
    steps:
      - name: Check out labeler config
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Label pull request
        id: label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

      - name: Decide what runs
        id: flags
        shell: bash
        env:
          LABELED: ${{ steps.label.outcome == 'success' }}
          LABELS: ${{ steps.label.outputs.all-labels }}
        run: |
          if [ "$LABELED" != "true" ]; then
            echo "No labels (no PR, or labeling failed): running everything."
            { echo code=true; echo release-scripts=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Labels: $LABELS"
          has() { tr ',' '\n' <<< "$LABELS" | grep -qxF "$1"; }
          if has docs-only; then echo code=false; else echo code=true; fi >> "$GITHUB_OUTPUT"
          if has release-scripts; then echo release-scripts=true; else echo release-scripts=false; fi >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    uses: ./.github/workflows/_build-web.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      upload-artifact: false

  release-scripts:
    name: Release scripts (${{ matrix.os }})
    # Gated per step, not with a job-level `if`: a skipped matrix job reports one check named
    # "Release scripts (${{ matrix.os }})", so per-OS required checks would never report.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out code
        if: needs.changes.outputs.release-scripts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: needs.changes.outputs.release-scripts == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test release scripts
        if: needs.changes.outputs.release-scripts == 'true'
        run: node --test "scripts/release/*.test.mjs"
