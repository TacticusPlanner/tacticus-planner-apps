name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "**/*.md"
      - "openspec/**"
      - ".claude/**"
      - ".agents/**"
      - ".design-sync/**"
      - LICENSE
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**/*.md"
      - "openspec/**"
      - ".claude/**"
      - ".agents/**"
      - ".design-sync/**"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build-web.yml
    with:
      upload-artifact: false
