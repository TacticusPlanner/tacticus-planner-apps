name: Coverage

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "openspec/**"
      - ".claude/**"
      - ".agents/**"
      - ".design-sync/**"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  # Cancel superseded PR runs only. Each push to main is the baseline PR coverage diffs compare
  # against, so a cancelled main run leaves PRs comparing against an older commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  # The file filter matches the docs-only label in .github/labeler.yml; keep the two in step.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qvE '\.md$|^(openspec|\.claude|\.agents|\.design-sync)/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # vitest --changed diffs base...HEAD, which needs the merge base in history.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRs run only tests related to files changed since the base (vitest --changed; package.json and
      # vite/vitest config changes still force a full run). Partial coverage would trip the global
      # thresholds, so they are enforced only by the full run on push to main.
      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: pnpm test:coverage

      - name: Run changed tests with coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # vitest swallows git errors and silently runs nothing, so fail loudly if the diff can't work.
          git merge-base "$BASE_SHA" HEAD > /dev/null
          # --force: the changed set comes from git, outside turbo's hash, so cached results can be stale.
          pnpm exec turbo run test:coverage --force -- --changed="$BASE_SHA" \
            --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Save coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/cobertura-coverage.xml
            packages/ui/coverage/cobertura-coverage.xml
            packages/game-catalog/coverage/cobertura-coverage.xml
          retention-days: 1

  # Publishing needs a write token, so it runs apart from the job that executes the PR's code.
  publish:
    name: Publish coverage
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15 # three uploads, each may wait up to 160 s for processing
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports

      - name: Upload web coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: apps/web/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/web
          # Upload is rejected for some PR branch names (HTTP 400); that must not fail the PR, but a
          # failed upload of the main baseline still fails the run.
          fail-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Upload ui coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: packages/ui/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/ui
          # Upload is rejected for some PR branch names (HTTP 400); that must not fail the PR, but a
          # failed upload of the main baseline still fails the run.
          fail-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Upload game-catalog coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: packages/game-catalog/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/game-catalog
          # Upload is rejected for some PR branch names (HTTP 400); that must not fail the PR, but a
          # failed upload of the main baseline still fails the run.
          fail-on-error: ${{ github.event_name != 'pull_request' }}
