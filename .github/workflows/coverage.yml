name: Coverage

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "openspec/**"
      - ".claude/**"
      - ".agents/**"
      - ".design-sync/**"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write
  pull-requests: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must always report, so PRs are not filtered with paths-ignore;
  # instead the work is skipped (a skipped job satisfies a required check).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') || { echo code=true >> "$GITHUB_OUTPUT"; exit 0; }
          if grep -qvE '\.md$|^(openspec|\.claude|\.agents|\.design-sync)/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # vitest --changed diffs base...HEAD, which needs the merge base in history.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRs run only tests related to files changed since the base (vitest --changed; package.json and
      # vite/vitest config changes still force a full run). Partial coverage would trip the global
      # thresholds, so they are enforced only by the full run on push to main.
      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        run: pnpm test:coverage

      - name: Run changed tests with coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # vitest swallows git errors and silently runs nothing, so fail loudly if the diff can't work.
          git merge-base "$BASE_SHA" HEAD > /dev/null
          # --force: the changed set comes from git, outside turbo's hash, so cached results can be stale.
          pnpm exec turbo run test:coverage --force -- --changed="$BASE_SHA" \
            --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload web coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: apps/web/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/web

      - name: Upload ui coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: packages/ui/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/ui

      - name: Upload game-catalog coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: packages/game-catalog/coverage/cobertura-coverage.xml
          language: TypeScript
          label: coverage/game-catalog
