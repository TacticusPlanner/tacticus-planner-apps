<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacticus Planner</title>
    <meta
      name="description"
      content="Free fan-made planner for Tacticus: set goals for your roster and get a daily plan for raids, events and upgrades, synced from your game account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tacticus Planner" />
    <meta property="og:title" content="Tacticus Planner" />
    <meta
      property="og:description"
      content="Set goals for your Tacticus roster and get a daily plan for raids, events and upgrades, synced from your game account."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tacticus Planner" />
    <meta
      name="twitter:description"
      content="Set goals for your Tacticus roster and get a daily plan for raids, events and upgrades, synced from your game account."
    />
    <!-- Applies the stored theme before first paint (ThemeProvider takes over after). -->
    <script>
      try { var t = localStorage.getItem("theme") } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      document.documentElement.classList.add(t)
      // Mirrors shared/theme's THEME_COLORS.
      if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#191C23"
    </script>
  </head>
  <body>
    <!-- Static copy of app/boot-screen.tsx, shown until React renders over it, so the installed
         app's splash (site.webmanifest background_color) runs straight into the boot screen. -->
    <div id="root">
      <style>
        #boot { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #0b1222; }
        #boot .logo { position: relative; }
        #boot img { display: block; width: 208px; height: 208px; }
        #boot .bar { position: absolute; top: 100%; left: 50%; width: 64px; height: 4px; margin: 24px 0 0 -32px; border-radius: 9999px; background: rgb(255 255 255 / 0.3); animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes boot-pulse { 50% { opacity: 0.5; } }
        @media (prefers-reduced-motion: reduce) { #boot .bar { animation: none; } }
      </style>
      <div id="boot" role="status" aria-label="Loading…">
        <div class="logo">
          <img src="/web-app-manifest-192x192.png" alt="" aria-hidden="true" />
          <div class="bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
