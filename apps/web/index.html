<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacticus Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.uj ||= new Proxy({}, { get: (_, p) => p == 'then' ? 0 : (...a) => { (window.$ujq ||= []).push([p, ...a]) } });
      uj.init('%VITE_USERJOT_PROJECT_ID%', {
        widget: {
          launcher: false,
          whispers: false,
          notifications: { updates: 'none' },
        },
      });
    </script>
    <script type="module" async src="https://cdn.userjot.com/sdk/v3/uj.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
