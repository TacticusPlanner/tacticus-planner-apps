packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@eslint/js": ^10.0.1
  "@tailwindcss/vite": ^4.3.5
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.10
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/coverage-v8": ^5.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.14.0
  eslint-plugin-better-tailwindcss: ^4.10.0
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.14.0
  knip: 6.29.0
  lucide-react: ^1.70.0
  prettier: ^3.9.10
  radix-ui: ^1.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  shadcn: ^4.23.0
  tailwind-merge: ^3.7.0
  tw-animate-css: ^1.4.0
  # Two TypeScripts side by side. `typescript` stays on 6.x because typescript-eslint, the
  # other ESLint plugins and openapi-typescript load the JS compiler API, which TS 7 no longer
  # ships; their peer dependency resolves to it. `typescript7` is the native compiler: its `tsc`
  # bin wins over 6.x's (pnpm links the higher version on a bin clash), so typecheck and build
  # run on TS 7. Dependabot skips npm: aliases, so bump typescript7 by hand.
  typescript: ~6.0.3
  typescript7: npm:typescript@~7.0.2
  typescript-eslint: ^8.72.2
  jsdom: ^30.1.3
  vitest: ^5.0.5

allowBuilds:
  "@posthog/cli": false
  core-js: true
  esbuild: true
  lefthook: true
  msw: false

minimumReleaseAgeExclude:
  - lucide-react@1.22.0
  - "@posthog/core@1.54.2"
  - "@posthog/types@1.412.1"
  - posthog-js@1.433.5
